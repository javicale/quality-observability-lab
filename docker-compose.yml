services:
  lgtm:
    image: grafana/otel-lgtm:0.32.1
    container_name: quality-observability-lgtm
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
      - "3100:3100"
      - "3200:3200"
      - "9090:9090"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/quality-observability.json
    volumes:
      - ./infra/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./infra/grafana/quality-observability.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/quality-observability.json:ro
