name: Quality Observability Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-observability-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
